name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: 8.7 }
      - name: Use your signing key (required for passkeys)
        env:
          KS: ${{ secrets.KEYSTORE_BASE64 }}
          KSP: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > ez.jks
            printf "storeFile=ez.jks\nstorePassword=%s\nkeyAlias=ez\nkeyPassword=%s\n" "$KSP" "$KSP" > keystore.properties
          else
            echo "No KEYSTORE_BASE64 secret: building with a throwaway debug key, so passkeys won't work with this APK."
          fi
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with: { name: notes-apk, path: app/build/outputs/apk/debug/app-debug.apk }
